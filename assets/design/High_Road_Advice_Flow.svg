<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 890" role="img" aria-label="Borrowed advice &amp; the crossing"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b8b8bf"/></marker></defs><rect width="760" height="890" rx="20" fill="#101216"/><text x="36" y="48" fill="#f0e6da" font-family="Georgia,serif" font-size="28">Borrowed advice &amp; the crossing</text><text x="36" y="75" fill="#aaa8a5" font-family="sans-serif" font-size="13">HIGH ROAD / Opening capsule prototype / Flow 01</text><rect x="215" y="105" width="330" height="88" rx="12" fill="#191c22" stroke="#ff8b3e" stroke-opacity=".75"/><text x="380.0" y="134" text-anchor="middle" fill="#ff8b3e" font-family="sans-serif" font-size="17" font-weight="600">Starting courtyard</text><text x="380.0" y="159" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Choose advice on solid ground.</text><text x="380.0" y="179" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Route remains uncommitted.</text><path d="M380 193 V222 H200 V250" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M380 222 H560 V250" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="250" width="290" height="112" rx="12" fill="#191c22" stroke="#6ab9ee" stroke-opacity=".75"/><text x="200.0" y="279" text-anchor="middle" fill="#6ab9ee" font-family="sans-serif" font-size="17" font-weight="600">DOUBT · Q</text><text x="200.0" y="304" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Blue stepping stones appear.</text><text x="200.0" y="324" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Use several jumps to cross.</text><rect x="415" y="250" width="290" height="112" rx="12" fill="#191c22" stroke="#ff8b3e" stroke-opacity=".75"/><text x="560.0" y="279" text-anchor="middle" fill="#ff8b3e" font-family="sans-serif" font-size="17" font-weight="600">DESIRE · F</text><text x="560.0" y="304" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Orange launch pad appears.</text><text x="560.0" y="324" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Hold W + Space for a long leap.</text><path d="M200 362 V400 H380 V432" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M560 362 V400 H380" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="215" y="432" width="330" height="78" rx="12" fill="#191c22" stroke="#e5d3a6" stroke-opacity=".75"/><text x="380.0" y="461" text-anchor="middle" fill="#e5d3a6" font-family="sans-serif" font-size="17" font-weight="600">Attempt the crossing</text><text x="380.0" y="486" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Does the player reach the far side?</text><path d="M545 471 H600 V540" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="585" y="459" text-anchor="middle" fill="#bcb9b3" font-family="sans-serif" font-size="12">Fall</text><rect x="485" y="540" width="230" height="98" rx="12" fill="#191c22" stroke="#bca7e2" stroke-opacity=".75"/><text x="600.0" y="569" text-anchor="middle" fill="#bca7e2" font-family="sans-serif" font-size="17" font-weight="600">Retry</text><text x="600.0" y="594" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Return near the crossing.</text><text x="600.0" y="614" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Active advice is retained.</text><path d="M715 588 H738 V417 H380 V432" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M380 510 V655" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="292" y="585" text-anchor="middle" fill="#bcb9b3" font-family="sans-serif" font-size="12">Reach the far side</text><rect x="190" y="655" width="380" height="92" rx="12" fill="#191c22" stroke="#e8e6e2" stroke-opacity=".75"/><text x="380.0" y="684" text-anchor="middle" fill="#e8e6e2" font-family="sans-serif" font-size="17" font-weight="600">Reflect at the white cube · E</text><text x="380.0" y="709" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Record the crossing used.</text><text x="380.0" y="729" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Hear both voices respond.</text><path d="M380 747 V782" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="160" y="782" width="440" height="78" rx="12" fill="#191c22" stroke="#ff8b3e" stroke-opacity=".75"/><text x="380.0" y="811" text-anchor="middle" fill="#ff8b3e" font-family="sans-serif" font-size="17" font-weight="600">Return to the courtyard</text><text x="380.0" y="836" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Try the other advice or talk about a route.</text></svg>