<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1260" viewBox="0 0 1440 1260" role="img" aria-labelledby="title desc"><title id="title">High Road: proposed branching encounter workflow</title><desc id="desc">An unimplemented design proposal. Choose Doubt or Desire, meet the opposing emotion, then resist, take its advice, or switch routes. One temporary consequence applies to the next segment before the next encounter.</desc>
