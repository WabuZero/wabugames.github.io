<text x="270" y="903" fill="#91d6c1" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle">STAY + RESIST</text>
<text x="270" y="939" fill="#e9e5df" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Keep the current route.</text>
<text x="270" y="969" fill="#c7d5cf" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Gain one route-specific assist</text>
<text x="270" y="993" fill="#c7d5cf" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">for the next segment.</text>
<rect x="530" y="866" width="380" height="147" rx="18" fill="#30291b" stroke="#d7b36d" stroke-width="2"/>
<text x="720" y="903" fill="#efd198" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="700" text-anchor="middle">STAY + TAKE ADVICE</text>
<text x="720" y="939" fill="#e9e5df" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Keep the current route.</text>
<text x="720" y="969" fill="#dad2be" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Try a tactical alternative with</text>
<text x="720" y="993" fill="#dad2be" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">one benefit and one added risk.</text>
<rect x="980" y="866" width="380" height="147" rx="18" fill="#29233b" stroke="#ab9fe5" stroke-width="2"/>
<text x="1170" y="903" fill="#c9bdf8" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle">SWITCH ROUTES</text>
<text x="1170" y="939" fill="#e9e5df" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Move at a designated junction.</text>
<text x="1170" y="969" fill="#d3cdde" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">Preserve progress; the opposing</text>
<text x="1170" y="993" fill="#d3cdde" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">emotion becomes the new guide.</text>
