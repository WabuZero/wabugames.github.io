<text x="270" y="827" fill="#bfe6da" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">“I’m staying my course.”</text>
<text x="720" y="827" fill="#eddbb5" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">“I’ll consider your advice.”</text>
<text x="1170" y="827" fill="#d9d1f5" font-family="DejaVu Sans, sans-serif" font-size="17" font-weight="400" text-anchor="middle">“Show me the other way.”</text>
