<text x="1060" y="414" fill="#ffad75" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" text-anchor="middle">DESIRE ROUTE</text>
<text x="1060" y="448" fill="#f3dfcd" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" text-anchor="middle">Platforming · risk · the future</text>
