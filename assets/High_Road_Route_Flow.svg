<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 925" role="img" aria-label="Conversation &amp; route commitment"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#b8b8bf"/></marker></defs><rect width="760" height="925" rx="20" fill="#101216"/><text x="36" y="48" fill="#f0e6da" font-family="Georgia,serif" font-size="28">Conversation &amp; route commitment</text><text x="36" y="75" fill="#aaa8a5" font-family="sans-serif" font-size="13">HIGH ROAD / Opening capsule prototype / Flow 02</text><rect x="210" y="110" width="340" height="88" rx="12" fill="#191c22" stroke="#e8e6e2" stroke-opacity=".75"/><text x="380.0" y="139" text-anchor="middle" fill="#e8e6e2" font-family="sans-serif" font-size="17" font-weight="600">Explore the courtyard</text><text x="380.0" y="164" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Meet either voice, in either order.</text><text x="380.0" y="184" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">The crossing is optional.</text><path d="M380 198 V234 H200 V270" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M380 234 H560 V270" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="55" y="270" width="290" height="96" rx="12" fill="#191c22" stroke="#6ab9ee" stroke-opacity=".75"/><text x="200.0" y="299" text-anchor="middle" fill="#6ab9ee" font-family="sans-serif" font-size="17" font-weight="600">Talk to DOUBT · E</text><text x="200.0" y="324" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Hear the introduction and any</text><text x="200.0" y="344" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">reaction to the latest crossing.</text><rect x="415" y="270" width="290" height="96" rx="12" fill="#191c22" stroke="#ff8b3e" stroke-opacity=".75"/><text x="560.0" y="299" text-anchor="middle" fill="#ff8b3e" font-family="sans-serif" font-size="17" font-weight="600">Talk to DESIRE · E</text><text x="560.0" y="324" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Hear the introduction and any</text><text x="560.0" y="344" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">reaction to the latest crossing.</text><path d="M200 366 V405 H380 V440" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M560 366 V405 H380" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="215" y="440" width="330" height="82" rx="12" fill="#191c22" stroke="#e5d3a6" stroke-opacity=".75"/><text x="380.0" y="469" text-anchor="middle" fill="#e5d3a6" font-family="sans-serif" font-size="17" font-weight="600">Finish the conversation</text><text x="380.0" y="494" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">View that voice’s route offer.</text><path d="M215 481 H155 V566" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="134" y="468" text-anchor="middle" fill="#bcb9b3" font-family="sans-serif" font-size="12">Back out</text><rect x="45" y="566" width="250" height="100" rx="12" fill="#191c22" stroke="#bca7e2" stroke-opacity=".75"/><text x="170.0" y="595" text-anchor="middle" fill="#bca7e2" font-family="sans-serif" font-size="17" font-weight="600">Keep exploring</text><text x="170.0" y="620" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">No route is committed.</text><text x="170.0" y="640" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Meet the other voice or try advice.</text><path d="M45 613 H22 V154 H210" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><path d="M545 481 H565 V566" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="602" y="467" text-anchor="middle" fill="#bcb9b3" font-family="sans-serif" font-size="12">Confirm</text><rect x="405" y="566" width="310" height="100" rx="12" fill="#191c22" stroke="#ff8b3e" stroke-opacity=".75"/><text x="560.0" y="595" text-anchor="middle" fill="#ff8b3e" font-family="sans-serif" font-size="17" font-weight="600">Commit to the offered route</text><text x="560.0" y="620" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Record Doubt or Desire.</text><text x="560.0" y="640" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">End the opening slice.</text><path d="M560 666 V723" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><rect x="405" y="723" width="310" height="78" rx="12" fill="#191c22" stroke="#e8e6e2" stroke-opacity=".75"/><text x="560.0" y="752" text-anchor="middle" fill="#e8e6e2" font-family="sans-serif" font-size="17" font-weight="600">Restart to explore again</text><text x="560.0" y="777" text-anchor="middle" fill="#d1ced0" font-family="sans-serif" font-size="14">Clear advice and crossing history.</text><path d="M560 801 V884 H22 V154 H210" stroke="#b8b8bf" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="45" y="837" fill="#aaa8a5" font-family="sans-serif" font-size="13">Backing out during dialogue also returns to exploration.</text><text x="45" y="858" fill="#aaa8a5" font-family="sans-serif" font-size="13">Later route levels are outside this opening prototype.</text></svg>